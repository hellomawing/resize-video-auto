# 从源码构建并运行的 compose（开发 / 自建场景）
#
#   docker compose up -d --build
#
# 部署到 NAS 请用 deploy/docker-compose.yml（直接拉镜像，不需要构建环境）。

services:
  video-splitter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: video-splitter:dev
    container_name: video-splitter
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Asia/Shanghai
      # 改成你在 NAS 上的用户 id（SSH 里执行 id 你的用户名 可以查到）。
      # 保持 0 就是 root 运行，写出来的切片属主会是 root，NAS 文件管理里不好操作。
      PUID: 1000
      PGID: 1000
      UMASK: "022"
      VS_LOG_LEVEL: info
    volumes:
      - ./data:/data
      # 挂进来的目录就是网页上能浏览、能添加监控的范围（没有额外的白名单要配），
      # 容器内路径与宿主机保持一致最省心。
      # Windows / macOS 开发时换成自己的目录，例如：
      # - D:/Videos:/vol1
      - /vol1:/vol1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
