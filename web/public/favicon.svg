<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 播放三角左半（主体，白色） -->
  <path d="M 20 18 L 38 26.4 L 38 37.6 L 20 46 Z" fill="#FFFFFF"/>
  <!-- 播放三角右半（切开并向右上错位，浅蓝） -->
  <path d="M 38 26.4 L 51 32 L 38 37.6 Z" fill="#93C5FD" transform="translate(5 -3)"/>
  <!-- 切线 -->
  <rect x="39.75" y="14" width="2.5" height="36" rx="1.25" fill="#FBBF24"/>
</svg>
