# 给 NAS 用的部署编排（直接拉镜像，不需要源码和构建环境）
#
#   1. 复制 .env.example 为 .env，填好 PUID / PGID / 镜像名
#   2. docker compose up -d
#   3. 浏览器打开 http://NAS的IP:8099
#
# 飞牛 fnOS 用户也可以直接用 fnos/ 目录打出来的 fpk 应用包，
# 那个包已经内置了下面这套编排，装完在应用中心点开就能用。

services:
  video-splitter:
    image: ${VS_IMAGE:-mawing/video-splitter:latest}
    container_name: video-splitter
    restart: unless-stopped
    ports:
      - "${VS_PORT:-8099}:8099"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # NAS 上的用户 id：SSH 里执行 `id 你的用户名`，取 uid 和 gid 两项。
      # 注意 gid 常常不等于 uid——实测飞牛 fnOS 的 admin 是 1000:1001。
      # 不填就按 root 跑，切片属主会是 root，文件管理里不好改也不好删。
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1001}
      UMASK: "022"
      VS_LOG_LEVEL: info
    volumes:
      # 全部状态（配置、监控目录列表、数据库、任务历史、失败清单）都在这个
      # named volume 里。用它的理由：
      #   * 你不用填路径、也不用知道它在哪 —— Docker 自己管；
      #   * 容器重建、升级镜像、甚至删掉容器重建都不会丢（绑定挂载反而会因为
      #     相对路径 / 挪目录而指向空目录，看起来就像数据没了）。
      # 备份走「设置 → 导出配置」，或者整卷打包：
      #   docker run --rm -v video-splitter-data:/data -v "$PWD":/backup \
      #     alpine tar czf /backup/vs-data.tgz -C /data .
      - vsdata:/data
      # 要处理的视频：挂进来的目录就是网页上能浏览、能添加监控的范围
      # （没有额外的白名单要配），容器内路径与宿主机保持一致最省心
      - /vol1:/vol1
      # 有多个存储空间就继续加，挂上即可，网页上立刻能选到
      # - /vol2:/vol2
      # - /vol3:/vol3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 固定卷名（不加 compose 的项目名前缀），上面那条备份命令才认得出。
# 注意：删卷要先 `docker compose down -v`，普通的 down 不会删。
volumes:
  vsdata:
    name: video-splitter-data
