# 给 NAS 用的部署编排（直接拉镜像，不需要源码和构建环境）
#
#   1. 复制 .env.example 为 .env，填好 PUID / PGID / 镜像名
#   2. docker compose up -d
#   3. 浏览器打开 http://NAS的IP:8099
#
# 飞牛 fnOS 用户也可以直接用 fnos/ 目录打出来的 fpk 应用包，
# 那个包已经内置了下面这套编排，装完在应用中心点开就能用。

services:
  video-splitter:
    image: ${VS_IMAGE:-yourname/video-splitter:latest}
    container_name: video-splitter
    restart: unless-stopped
    ports:
      - "${VS_PORT:-8099}:8099"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # NAS 上的用户 id：SSH 里执行 `id 你的用户名`，取 uid 和 gid 两项。
      # 注意 gid 常常不等于 uid——实测飞牛 fnOS 的 admin 是 1000:1001。
      # 不填就按 root 跑，切片属主会是 root，文件管理里不好改也不好删。
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1001}
      UMASK: "022"
      VS_LOG_LEVEL: info
    volumes:
      # 全部状态（配置、监控目录列表、数据库、任务历史、失败清单）都在这里，
      # 备份 = 把这一整个目录拷走。
      # 建议用绝对路径（如 /vol1/1000/video-splitter/data）而不是 ./data —— 相对路径
      # 跟着 compose 文件所在目录解析，挪了 deploy/ 就会指向另一个空目录，
      # 看起来像数据全丢。改路径不会自动搬数据：先 down、拷旧目录、再 up -d。
      - ${VS_DATA:-./data}:/data
      # 监控目录：容器内路径与宿主机保持一致，这样默认白名单 /vol1…/vol4 直接可用
      - /vol1:/vol1
      # 有多个存储空间就继续加，并在网页「设置 → 可访问根目录」里补上
      # - /vol2:/vol2
      # - /vol3:/vol3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
